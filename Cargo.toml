# CLDR — Command Line Dispatch & Route
# © 2026 Dr. Sohil Momin. MIT licensed — attribution watermark required on copies.
[package]
name = "cldr"
version = "1.2.0"
edition = "2021"
authors = ["Dr. Sohil Momin"]
description = "CLDR - Command Line Dispatch & Route. Minimal, zero-bloat command launcher with a background tray-resident summon window for Windows and Linux."
license = "MIT"
readme = "README.md"
repository = "https://github.com/drsamonline/cldr"
homepage = "https://github.com/drsamonline/cldr"
documentation = "https://github.com/drsamonline/cldr/blob/main/docs/USER_GUIDE.md"
keywords = ["launcher", "palette", "tray", "hotkey", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "cldr"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
open = "5.3"
walkdir = "2.5"

# A1 (v1.2): the summon signal travels over a std::net loopback-TCP control
# channel (src/ipc.rs) — the arboard clipboard mailbox is gone, so the app
# never touches the user's clipboard again. Native tray integration + the
# launch-shortcut installers live in `scripts/` (see docs/SETUP_GUIDE.md).

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
