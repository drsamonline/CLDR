<style>
  :root{--ink:#131417;--ink-2:#1a1b1f;--ink-3:#212228;--rust:#e2582a;--rust-hi:#ff6f3c;
    --line:#2f3037;--text:#d9d7d2;--muted:#8b8f96;--steel-warm:#a9a49b;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;}
  *{box-sizing:border-box;border-radius:0}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:var(--text);
    font-family:Inter,"Segoe UI",system-ui,sans-serif;
    background-image:linear-gradient(90deg,rgba(226,88,42,.05) 1px,transparent 1px),
      linear-gradient(0deg,rgba(139,143,150,.04) 1px,transparent 1px);
    background-size:56px 56px,56px 56px;padding:2rem}
  .box{max-width:620px;width:100%;border:1px solid var(--line);background:var(--ink-2);
    border-left:3px solid var(--rust);padding:2.2rem}
  .brand{display:flex;align-items:center;gap:.6rem;font-family:var(--mono);font-weight:700;
    letter-spacing:.12em;color:var(--text);margin-bottom:1.4rem}
  .brand svg{width:26px;height:26px;color:var(--rust)}
  .code{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:.6rem}
  h1{font-size:clamp(2rem,7vw,3.2rem);margin:0 0 .6rem;letter-spacing:-.01em}
  h1 span{color:var(--rust)}
  p{color:var(--muted);margin:0 0 1.4rem}
  .term{background:#0e0f11;border:1px solid var(--line);padding:1rem 1.1rem;font-family:var(--mono);
    font-size:.83rem;color:#cfcdc8;margin-bottom:1.6rem}
  .term .p{color:#7fb3a6}
  .term .r{color:#d98cc0}
  .row{display:flex;flex-wrap:wrap;gap:.7rem}
  a.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.8rem;
    letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:.62rem 1.05rem;
    border:1px solid var(--rust);background:var(--rust);color:#131417;text-decoration:none}
  a.btn:hover{background:var(--rust-hi)}
  a.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
  a.btn.ghost:hover{border-color:var(--rust);color:var(--rust-hi)}
  footer{margin-top:1.8rem;padding-top:1.2rem;border-top:1px solid var(--line);
    font-size:.8rem;color:var(--muted)}
  footer b{color:var(--steel-warm)}
</style>
</head>

      CLDR

    <h1>Route <span>not found</span></h1>
    <p>That path did not resolve. CLDR routes commands; this one routed nowhere.</p>
    <div class="term"><span class="p">&gt;</span> <span class="r">/find this-page</span><br>not found</div>
    <div class="row">
      <a class="btn" href="https://drsamonline.github.io/CLDR/">Back to home</a>
      <a class="btn ghost" href="https://github.com/drsamonline/CLDR">Repository</a>
    </div>
    <footer>© 2026 <b>Built by Dr. Sohil Momin</b> · PolyForm Noncommercial licensed with a mandatory attribution clause.</footer>
  </main>
</body>
</html>
