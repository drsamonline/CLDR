# Deploy the demo to Pages.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: LicenseRef-Forge-Proprietary
#
# This repo is NOT one of the web apps, so it keeps its own build:
#   it is a Rust command launcher, released by build-release.yml
#
# What it was missing is the DEPLOY - the same gap the app repos had. A public repo
# can only call a PUBLIC reusable workflow, and the Pages workflow lived only in the
# private forge repo, so this site could never deploy and went stale while its source
# kept changing.
#
# Only the deploy lives here. The build stays where it belongs.
#
# Keep this file MINIMAL. An earlier version of it - identical except that the job
# was named `pages`, carried its own permissions block and its own concurrency group -
# was accepted by the API and then produced a run with ZERO JOBS, which is what
# GitHub does with a workflow it will not start. Nothing in the log, because there
# was no job to log. This form runs.

name: Deploy the demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: drsamonline/app-builder/.github/workflows/pages.yml@34fa725eac5ea93ea276c2db375a4f1004123a62   # was @main
    with:
      path: docs
