# =============================================================================
#
#  push / PR          → check job: fmt, clippy, build, tests, self-test
#  push to main       → check job only (no publish — releases are tag-driven)
#  push tag v*        → check → build matrix → portable archives + Windows
#                       installer + SHA256SUMS + build provenance → GitHub Release
#  workflow_dispatch  → same as a tag (manual release)
#
# To cut a release:  git tag v1.3.0 && git push origin v1.3.0
# (The tag must match the `version` in Cargo.toml — the guard below enforces it.)
name: Build & Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # CI gate: correctness on every push / PR
  # ---------------------------------------------------------------------------
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Self-test (headless)
        run: cargo run --release --locked -- --self-test

      # Informational only for now: promote to blocking once the tree is
      # confirmed fmt/clippy-clean locally (`cargo fmt` && `cargo clippy --fix`).
      - name: rustfmt check
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: clippy
        continue-on-error: true
        run: cargo clippy --all-targets --locked

  # ---------------------------------------------------------------------------
  # Release matrix: portable archives for Windows + Linux (x86_64 + aarch64)
  # ---------------------------------------------------------------------------
  release:
    name: Release (${{ matrix.job.name }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.job.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job.name }}

      # ---- Guard: git tag must match Cargo.toml (only if an actual tag was pushed)
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $pkg"
            exit 1
          fi

      # ---- Linux cross toolchain
      - name: Install cross toolchain (aarch64-linux)
        if: matrix.job.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build (release, ${{ matrix.job.target }})
        run: cargo build --release --locked --target ${{ matrix.job.target }}

      # ---- Package: portable archive (binary + docs + installers) ----------
      - name: Package (Windows)
        if: matrix.job.archive == 'zip'
        shell: pwsh
        run: |
          $name = "cldr-${{ matrix.job.name }}"
          $stage = "stage/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.job.target }}/release/cldr.exe" $stage
          Copy-Item README.md, LICENSE, CHANGELOG.md $stage
          New-Item -ItemType Directory -Force -Path "$stage/docs" | Out-Null
          Copy-Item docs/*.md "$stage/docs"
          New-Item -ItemType Directory -Force -Path "$stage/scripts" | Out-Null
          Copy-Item scripts/*.ps1, scripts/*.sh "$stage/scripts"
          Copy-Item packaging/PORTABLE.txt $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$name.zip"
          Get-Item "$name.zip" | Format-List Name,Length

      - name: Package (Linux)
        if: matrix.job.archive == 'tar.gz'
        run: |
          name="cldr-${{ matrix.job.name }}"
          stage="stage/$name"
          mkdir -p "$stage/docs" "$stage/scripts"
          cp "target/${{ matrix.job.target }}/release/cldr" "$stage/"
          cp README.md LICENSE CHANGELOG.md "$stage/"
          cp docs/*.md "$stage/docs/"
          cp scripts/*.sh "$stage/scripts/"
          cp packaging/PORTABLE.txt packaging/install.sh packaging/uninstall.sh "$stage/"
          chmod +x "$stage/cldr" "$stage/install.sh" "$stage/uninstall.sh" "$stage/scripts/"*.sh
          tar -C stage -czf "$name.tar.gz" "$name"
          ls -lh "$name.tar.gz"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: cldr-${{ matrix.job.name }}
          path: cldr-${{ matrix.job.name }}.*

  # ---------------------------------------------------------------------------
  # Windows installer (Inno Setup) — built once, from the windows artifact
  # ---------------------------------------------------------------------------
  installer:
    name: Windows installer
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the Windows portable build
        uses: actions/download-artifact@v4
        with:
          name: cldr-windows-x86_64
          path: dist

      - name: Unpack portable archive
        shell: pwsh
        run: |
          Expand-Archive -Path dist/cldr-windows-x86_64.zip -DestinationPath dist/pkg -Force
          Get-ChildItem -Recurse dist/pkg | Select-Object FullName

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ github.ref_name }} `
            /DSourceDir="${{ github.workspace }}\dist\pkg\cldr-windows-x86_64" `
            /DOutputDir="${{ github.workspace }}\dist" `
            packaging\cldr.iss
          Get-ChildItem dist -Filter *.exe | Format-List Name,Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: cldr-installer-windows
          path: dist/*.exe

  # ---------------------------------------------------------------------------
  # Publish: checksums + provenance + GitHub Release
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [release, installer]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine release tag
        id: release_info
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            pkg_ver=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
            echo "tag=v${pkg_ver}" >> "$GITHUB_OUTPUT"
          fi

      # Fresh directory — never reuse a committed path (keeps stale binaries out).
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt || sha256sum $(ls | grep -v SHA256SUMS) > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "release-assets/*"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: CLDR ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## CLDR ${{ steps.release_info.outputs.tag }}

            A single-binary command launcher: sits in the tray, pops up on your
            shortcut, runs anything you type. Zero runtime dependencies.

            **Portable** — download the archive for your platform, extract, run `cldr`.
            **Installer** — Windows: run `cldr-<version>-setup.exe`.
            **Linux** — extract and run `./install.sh`.

            Verify your download against `SHA256SUMS.txt`.

            ---
