name: Build & Release

on:
  push:
    # This matches all branches but explicitly ignores tag names so a tag push won't double-trigger
    branches: ["**"]        
    tags: ["v*"]            
  pull_request:
  workflow_dispatch:        

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # CI gate: build + tests on every push / PR
  # ---------------------------------------------------------------------------
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

  # ---------------------------------------------------------------------------
  # Release matrix: cross-compiled binaries for Linux (x86_64 + ARM) and Windows
  # ---------------------------------------------------------------------------
  release:
    name: Release (${{ matrix.job.name }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (${{ matrix.job.target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Cache cargo registry + target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.job.name }}

      # ---- Linux cross-compilation toolchains ------------------------------
      - name: Install cross toolchain (aarch64-linux)
        if: matrix.job.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # ---- Build ------------------------------------------------------------
      - name: Build (release, ${{ matrix.job.target }})
        run: cargo build --release --locked --target ${{ matrix.job.target }}

      # ---- Package artifacts (zip for Windows, tar.gz for Linux) -----------
      - name: Package artifact (Windows)
        if: contains(matrix.job.target, 'windows')
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.job.target }}/release/cldr.exe"
          Compress-Archive -Path $bin -DestinationPath cldr-${{ matrix.job.name }}.zip
          Get-Item cldr-${{ matrix.job.name }}.zip | Format-List Name,Length

      - name: Package artifact (Linux)
        if: contains(matrix.job.target, 'linux')
        run: |
          tar -C target/${{ matrix.job.target }}/release \
              -czf cldr-${{ matrix.job.name }}.tar.gz cldr
          ls -lh cldr-${{ matrix.job.name }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cldr-${{ matrix.job.name }}
          path: |
            cldr-*.tar.gz
            cldr-*.zip

  # ---------------------------------------------------------------------------
  # GitHub Release: attach all binaries when a v* tag is pushed
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release with binaries
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
