[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "traydrop"
version = "1.0.0"
description = "Background console app with tray icon; shortcut re-open foregrounds the window."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TrayDrop Contributors" }]
dependencies = [
    "pystray>=0.19",
    "Pillow>=9.0",
]
keywords = ["tray", "system-tray", "notification-area", "background", "console", "shortcut"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.urls]
Documentation = "https://github.com/yourname/traydrop/tree/main/docs"
Source = "https://github.com/yourname/traydrop"
Issues = "https://github.com/yourname/traydrop/issues"

[project.scripts]
traydrop = "traydrop.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
